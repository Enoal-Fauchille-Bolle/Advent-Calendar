# Start:   docker compose -f deploy/docker-compose.yml up -d --build
# Secrets: deploy/.env, see "Run with Docker" in README.md
services:
  advent-calendar:
    image: ghcr.io/enoal-fauchille-bolle/advent-calendar:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      # Reachable from this machine only, for a reverse proxy on the same host.
      # ADVENT_BIND=0.0.0.0 in deploy/.env opens it to the network.
      - "${ADVENT_BIND:-127.0.0.1}:${ADVENT_PUBLISHED_PORT:-3000}:3000"
    volumes:
      # The surprises, read-only: the server never writes them.
      - "${ADVENT_CONTENT:-../examples/content}:/content:ro"
    # The image has no curl or wget, so Node itself asks /healthz.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
